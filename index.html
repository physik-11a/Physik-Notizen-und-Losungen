<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physik Stufe 11 - Notizen & Lösungen</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            color: var(--accent-blue);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .section-title {
            font-size: 1.4rem;
            margin: 2rem 0 1rem;
            border-bottom: 2px solid var(--card-bg);
            padding-bottom: 0.5rem;
            color: var(--accent-green);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
        }

        .card {
            background-color: var(--card-bg);
            padding: 1.25rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
            border-color: var(--accent-blue);
        }

        .card-info h3 {
            margin: 0 0 0.3rem 0;
            font-size: 1rem;
        }

        .card-info span {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .badge {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Physik Stufe 11</h1>
        <p>Unterrichtsnotizen & Lösungen (Nur zum Ansehen)</p>
    </header>

    <main>
        <!-- KATEGORIE 1: LÖSUNGEN -->
        <div class="section-title">Lösungen zu Hausaufgaben</div>
        <div class="grid">
            <a href="Bewegungsd.jpeg" target="_blank" class="card">
                <div class="card-info">
                    <h3>27.08.2026</h3>
                    <span>Bewegungsdiagramme</span>
                </div>
                <div class="badge">Ansehen 👁️</div>
            </a>

            <a href="Geschwindigkeit.jpeg" target="_blank" class="card">
                <div class="card-info">
                    <h3>01.09.2026</h3>
                    <span>Geschwindigkeit</span>
                </div>
                <div class="badge">Ansehen 👁️</div>
            </a>
        </div>

        <!-- KATEGORIE 2: UNTERRICHTSNOTIZEN -->
        <div class="section-title">Unterrichtsnotizen</div>
        <div class="grid">
            <a href="Physik.pdf" target="_blank" class="card">
                <div class="card-info">
                    <h3>Quartal 1</h3>
                    <span>Begriffserklärungen & Beispiele</span>
                </div>
                <div class="badge">Ansehen 👁️</div>
            </a>

            <a href="..." target="_blank" class="card">
                <div class="card-info">
                    <h3>Quartal 2</h3>
                    <span>Demnächst</span>
                </div>
                <div class="badge">Ansehen 👁️</div>
            </a>
        </div>
    </main>
</div>

</body>
</html>
